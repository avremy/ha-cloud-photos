name: Cloud Photos
version: "0.2.0"
slug: cloud_photos
description: Sync photos from cloud providers (iCloud today, more planned) and serve them as a Home Assistant slideshow + gallery.
arch:
  - aarch64
  - amd64
  - armv7
url: "https://github.com/local/cloud-photos"
startup: services
boot: auto
init: false
host_network: true
hassio_api: true
hassio_role: manager
homeassistant_api: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-sync
panel_title: Cloud Photos
map:
  - config:rw
  - addons:rw
  - share:rw
  - ssl:ro
  - backup:rw
options:
  icloud_username: ""
  icloud_password: ""
  icloud_album: "Slideshow"
schema:
  icloud_username: str
  icloud_password: password
  icloud_album: str
